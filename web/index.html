<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QMG Mercury · 战场军需官</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, "Microsoft YaHei", sans-serif; background: #101b20; color: #eef1eb; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
    main { width: min(760px, calc(100% - 48px)); padding: 64px 0; }
    .eyebrow { color: #c9ac74; letter-spacing: .2em; font-size: 13px; }
    h1 { font-size: clamp(32px, 6vw, 56px); line-height: 1.2; margin: 24px 0; font-weight: 600; }
    .intro { max-width: 600px; font-size: 18px; line-height: 1.9; color: #b9c8ca; }
    .status { display: inline-block; margin: 24px 0; padding: 10px 16px; border: 1px solid #537c68; border-radius: 24px; color: #b3d7bf; }
    .next { padding-top: 28px; margin-top: 24px; border-top: 1px solid #344248; line-height: 1.9; color: #b9c8ca; }
    footer { margin-top: 48px; font-size: 13px; color: #819397; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">QMG MERCURY / 2026</p>
    <h1>战场军需官<br>从清晰的基础重新开始。</h1>
    <p class="intro">新的项目环境已经就绪。接下来，我们将逐步建立规则、对局和 AI，让每一步都有可验证的结果。</p>
    <p class="status">基础环境已启动</p>
    <div class="next">当前为重建起点，游戏功能尚未接入。下一步将确定规则范围与第一批可玩目标。</div>
    <footer>Mercury · v0.1.0</footer>
  </main>
</body>
</html>
