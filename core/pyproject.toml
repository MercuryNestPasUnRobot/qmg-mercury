[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qmg-core"
version = "0.1.0"
requires-python = ">=3.11"
description = "Headless token-position rules and deterministic simulation core"

[tool.setuptools]
packages = ["qmg_core"]

[tool.setuptools.package-data]
qmg_core = ["replay_web/*.html", "replay_web/*.css", "replay_web/*.js",
            "ai_debug_web/*.html", "ai_debug_web/*.css", "ai_debug_web/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
